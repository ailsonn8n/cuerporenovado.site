<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha IA de Investimentos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <header>
            <h1>Assistente Financeiro IA</h1>
        </header>
        <div class="chat-box" id="chat-box">
            <div class="message ai-message">Olá! Sou sua inteligência artificial voltada a investimentos. O que vamos analisar hoje?</div>
        </div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Ex: Simule juros compostos para mim...">
            <button id="send-btn" onclick="enviarMensagem()">Enviar</button>
        </div>
    </div>
    <script src="script.js?v=7"></script>
</body>
</html>
